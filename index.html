
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova Calculator</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
  font-family: Arial, sans-serif;
  color: white;
  background:
    radial-gradient(circle at top left, #293b72, transparent 45%),
    linear-gradient(145deg, #080d1b, #15162d, #090d18);
}

.calculator {
  width: 100%;
  max-width: 410px;
  padding: 25px;
  border: 1px solid #ffffff20;
  border-radius: 32px;
  background: linear-gradient(145deg, #1e2740dd, #101626f5);
  box-shadow: 0 25px 70px #0009, inset 0 1px #ffffff15;
  animation: appear .65s ease;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(25px) scale(.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 25px;
}

.brand {
  font-size: 19px;
  font-weight: 800;
  letter-spacing: 2px;
}

.tag {
  color: #a7b5d8;
  font-size: 11px;
  letter-spacing: 2px;
}

.display {
  min-height: 155px;
  padding: 20px 8px;
  margin-bottom: 22px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  text-align: right;
  overflow: hidden;
  border-bottom: 1px solid #ffffff18;
}

.expression {
  width: 100%;
  min-height: 35px;
  color: #9daecc;
  font-size: 23px;
  overflow-wrap: anywhere;
  word-break: break-word;
}

.result {
  min-height: 55px;
  margin-top: 10px;
  color: #fff;
  font-size: clamp(36px, 10vw, 50px);
  font-weight: 700;
  overflow-wrap: anywhere;
  word-break: break-word;
}

.keys {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
}

button {
  min-width: 0;
  height: 66px;
  border: 1px solid #ffffff0d;
  border-radius: 21px;
  color: #f5f7ff;
  background: #273149;
  font-size: 23px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 5px 0 #101626;
  transition: transform .12s, background .15s, box-shadow .12s;
  touch-action: manipulation;
}

button:active {
  transform: scale(.92) translateY(3px);
  box-shadow: 0 1px 0 #101626;
  background: #465574;
}

button.utility {
  background: #35425d;
  color: #a9c7ff;
}

button.operator {
  background: linear-gradient(145deg, #6748dc, #4930a9);
  box-shadow: 0 5px 0 #30216d;
}

button.clear {
  color: #ff9aaf;
  background: #51283d;
}

button.equal {
  background: linear-gradient(145deg, #36d6b0, #0d9c9c);
  color: #061b22;
  box-shadow: 0 5px 0 #086c70;
}

button.zero {
  grid-column: span 2;
}

.footer {
  margin-top: 24px;
  text-align: center;
  font-size: 10px;
  letter-spacing: 3px;
  color: #7382a5;
}

@media (max-width: 360px) {
  .calculator { padding: 17px; }
  .keys { gap: 9px; }
  button { height: 59px; border-radius: 17px; }
}
</style>
</head>

<body>
<div class="calculator">
  <div class="top">
    <div class="brand">✦ NOVA</div>
    <div class="tag">SMART CALCULATOR</div>
  </div>

  <div class="display">
    <div class="expression" id="expression">0</div>
    <div class="result" id="result">0</div>
  </div>

  <div class="keys">
    <button class="clear" data-action="clear">AC</button>
    <button class="utility" data-action="backspace">⌫</button>
    <button class="utility" data-action="percent">%</button>
    <button class="operator" data-value="÷">÷</button>

    <button data-value="7">7</button>
    <button data-value="8">8</button>
    <button data-value="9">9</button>
    <button class="operator" data-value="×">×</button>

    <button data-value="4">4</button>
    <button data-value="5">5</button>
    <button data-value="6">6</button>
    <button class="operator" data-value="-">−</button>

    <button data-value="1">1</button>
    <button data-value="2">2</button>
    <button data-value="3">3</button>
    <button class="operator" data-value="+">+</button>

    <button class="utility" data-action="sign">+/−</button>
    <button class="zero" data-value="0">0</button>
    <button data-value=".">.</button>
    <button class="equal" data-action="equals">=</button>
  </div>

  <div class="footer">DESIGNED FOR EVERYDAY MATH</div>
</div>

<script>
const expressionEl = document.getElementById("expression");
const resultEl = document.getElementById("result");

let expression = "";
let justCalculated = false;
let audioCtx;

function sound(freq = 550) {
  try {
    audioCtx ??= new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = "sine";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.045, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(
      0.001, audioCtx.currentTime + 0.07
    );

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.07);
  } catch (e) {}
}

function pretty(text) {
  return text.replace(/\*/g, " × ").replace(/\//g, " ÷ ")
    .replace(/\+/g, " + ").replace(/-/g, " − ")
    .replace(/\s+/g, " ").trim();
}

function update() {
  expressionEl.textContent = expression ? pretty(expression) : "0";
}

function safeCalculate(text) {
  if (!text || !/^[0-9+\-*/.()\s]+$/.test(text)) {
    throw new Error("Invalid expression");
  }

  const value = Function('"use strict"; return (' + text + ')')();

  if (typeof value !== "number" || !Number.isFinite(value)) {
    throw new Error("Invalid result");
  }

  return Number(value.toPrecision(12));
}

function addValue(value) {
  if (justCalculated) {
    if (/[0-9.]/.test(value)) expression = "";
    justCalculated = false;
  }

  if (/[+\-*/]/.test(value)) {
    if (!expression && value !== "-") return;
    if (/[+\-*/]$/.test(expression)) {
      expression = expression.slice(0, -1);
    }
  }

  if (value === ".") {
    const currentNumber = expression.split(/[+\-*/]/).pop();
    if (currentNumber.includes(".")) return;
    if (!currentNumber) value = "0.";
  }

  expression += value;
  update();
  resultEl.textContent = "…";

  try {
    resultEl.textContent = safeCalculate(expression);
  } catch (e) {
    resultEl.textContent = " ";
  }
}

function clearAll() {
  expression = "";
  justCalculated = false;
  expressionEl.textContent = "0";
  resultEl.textContent = "0";
}

function backspace() {
  expression = expression.slice(0, -1);
  justCalculated = false;
  update();

  try {
    resultEl.textContent = expression ? safeCalculate(expression) : "0";
  } catch (e) {
    resultEl.textContent = " ";
  }
}

function calculatePercent() {
  if (!expression) return;
  try {
    const value = safeCalculate(expression);
    expression = String(Number((value / 100).toPrecision(12)));
    update();
    resultEl.textContent = expression;
    justCalculated = true;
  } catch (e) {}
}

function toggleSign() {
  if (!expression) {
    expression = "-";
  } else if (expression.startsWith("-")) {
    expression = expression.slice(1);
  } else {
    expression = "-" + expression;
  }
  justCalculated = false;
  update();
  try {
    resultEl.textContent = safeCalculate(expression);
  } catch (e) {
    resultEl.textContent = " ";
  }
}

function equals() {
  if (!expression) return;
  try {
    const answer = safeCalculate(expression);
    expressionEl.textContent = pretty(expression) + " =";
    resultEl.textContent = answer;
    expression = String(answer);
    justCalculated = true;
  } catch (e) {
    resultEl.textContent = "Error";
  }
}

document.querySelectorAll("button").forEach(button => {
  button.addEventListener("click", () => {
    sound(button.dataset.action === "equals" ? 760 : 520);

    const action = button.dataset.action;
    const value = button.dataset.value;

    if (action === "clear") clearAll();
    else if (action === "backspace") backspace();
    else if (action === "percent") calculatePercent();
    else if (action === "sign") toggleSign();
    else if (action === "equals") equals();
    else addValue(value);
  });
});
</script>
</body>
</html>
