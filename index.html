
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Calculator</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #151923;
      font-family: Arial, sans-serif;
      color: white;
    }

    .calculator {
      width: min(340px, 92vw);
      padding: 20px;
      background: #252c3b;
      border-radius: 20px;
      box-shadow: 0 10px 30px #0005;
    }

    h2 {
      text-align: center;
      margin: 0 0 18px;
    }

    #display {
      width: 100%;
      height: 70px;
      margin-bottom: 14px;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: #10141d;
      color: white;
      text-align: right;
      font-size: 30px;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 9px;
    }

    button {
      min-height: 58px;
      border: 0;
      border-radius: 12px;
      background: #3b4559;
      color: white;
      font-size: 22px;
      cursor: pointer;
    }

    button:active { opacity: 0.7; }
    .operator { background: #e58b36; }
    .clear { background: #c74b55; }
    .equals {
      background: #238b69;
      grid-column: span 2;
    }
  </style>
</head>
<body>
  <main class="calculator">
    <h2>My Calculator</h2>
    <input id="display" value="0" readonly>

    <div class="buttons">
      <button class="clear" onclick="clearAll()">AC</button>
      <button onclick="deleteLast()">DEL</button>
      <button class="operator" onclick="chooseOperator('/')">÷</button>
      <button class="operator" onclick="chooseOperator('*')">×</button>

      <button onclick="digit('7')">7</button>
      <button onclick="digit('8')">8</button>
      <button onclick="digit('9')">9</button>
      <button class="operator" onclick="chooseOperator('-')">−</button>

      <button onclick="digit('4')">4</button>
      <button onclick="digit('5')">5</button>
      <button onclick="digit('6')">6</button>
      <button class="operator" onclick="chooseOperator('+')">+</button>

      <button onclick="digit('1')">1</button>
      <button onclick="digit('2')">2</button>
      <button onclick="digit('3')">3</button>
      <button onclick="decimal()">.</button>

      <button onclick="digit('0')">0</button>
      <button class="equals" onclick="calculate()">=</button>
    </div>
  </main>

  <script>
    const display = document.getElementById("display");

    let current = "0";
    let previous = null;
    let operator = null;
    let resetNext = false;

    function show() {
      display.value = current;
    }

    function digit(number) {
      if (current === "Error" || resetNext) {
        current = number;
        resetNext = false;
      } else if (current === "0") {
        current = number;
      } else {
        current += number;
      }
      show();
    }

    function decimal() {
      if (current === "Error" || resetNext) {
        current = "0";
        resetNext = false;
      }
      if (!current.includes(".")) current += ".";
      show();
    }

    function chooseOperator(next) {
      if (current === "Error") return;

      if (operator && !resetNext) calculate();

      previous = Number(current);
      operator = next;
      resetNext = true;
    }

    function calculate() {
      if (operator === null || previous === null ||
          current === "Error") return;

      const a = previous;
      const b = Number(current);
      let result;

      if (operator === "+") result = a + b;
      if (operator === "-") result = a - b;
      if (operator === "*") result = a * b;

      if (operator === "/") {
        if (b === 0) {
          current = "Error";
          show();
          operator = null;
          previous = null;
          resetNext = true;
          return;
        }
        result = a / b;
      }

      current = String(Number(result.toPrecision(12)));
      operator = null;
      previous = null;
      resetNext = true;
      show();
    }

    function clearAll() {
      current = "0";
      previous = null;
      operator = null;
      resetNext = false;
      show();
    }

    function deleteLast() {
      if (current === "Error" || resetNext) {
        current = "0";
        resetNext = false;
      } else {
        current = current.length > 1
          ? current.slice(0, -1) : "0";
      }
      show();
    }
  </script>
</body>
</html>
